[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentic-bioinformatics-portfolio"
version = "0.2.0"
description = "Agentic bioinformatics assistant: LLM agents + single-cell/spatial omics with CI and continuous evaluation."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Sergio Litwiniuk" }]
keywords = ["bioinformatics", "single-cell", "spatial-transcriptomics", "langchain", "langgraph", "llm", "rag"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Science/Research",
]
dependencies = [
    "pandas>=2.0",
    "langchain-core>=0.3",
]

[project.optional-dependencies]
agent = ["langchain", "langgraph", "chromadb", "langchain-openai", "mcp"]
omics = ["scanpy", "anndata", "squidpy", "decoupler", "shapely"]
dev = ["pytest", "ruff"]

[project.scripts]
agentic-bio = "agentic_bio.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_bio"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.isort]
known-first-party = ["common"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
